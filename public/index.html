<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#f43f5e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Eventos Haru"/>
  <title>Eventos Haru</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- ══ LOADING ══ -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <span class="loading-text" id="loading-text">Carregando...</span>
</div>

<!-- ══ TOAST ══ -->
<div id="toast"></div>

<!-- ══════════════════════════════════
     LOGIN
══════════════════════════════════ -->
<div id="page-login" class="page" style="
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  background: linear-gradient(160deg, #fff1f2 0%, #f8f8f8 50%);
  min-height:100dvh;
">
  <!-- Logo -->
  <img
    src="/img/logo.png"
    alt="Haru"
    style="width:110px;height:110px;object-fit:contain;margin-bottom:16px;filter:drop-shadow(0 4px 12px rgba(244,63,94,.2))"
    onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"
  />
  <!-- Fallback se a logo não carregar -->
  <div id="logo-fallback" style="
    display:none;width:80px;height:80px;
    background:var(--rosa);border-radius:20px;
    align-items:center;justify-content:center;
    font-size:32px;font-weight:800;color:white;
    margin-bottom:16px;
  ">H</div>

  <h1 style="font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px">
    Eventos <span style="color:var(--rosa)">Haru</span>
  </h1>
  <p style="font-size:12px;color:var(--text-4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:36px">
    Gestão de Produtos
  </p>

  <!-- Card de login -->
  <div style="width:100%;max-width:340px;background:white;border:1px solid var(--border);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow)">

    <!-- Erro -->
    <div id="login-erro" style="
      display:none;
      background:var(--rosa-light);
      border:1px solid var(--rosa-border);
      border-radius:var(--radius-sm);
      padding:10px 13px;
      font-size:13px;
      color:var(--vermelho);
      margin-bottom:14px;
    "></div>

    <!-- Usuário -->
    <div class="form-group">
      <label class="label">Usuário</label>
      <input
        class="input"
        type="text"
        id="login-usuario"
        placeholder="seu.usuario"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
      />
    </div>

    <!-- Senha -->
    <div class="form-group" style="margin-bottom:20px">
      <label class="label">Senha</label>
      <input
        class="input"
        type="password"
        id="login-senha"
        placeholder="••••••••"
        autocomplete="current-password"
      />
    </div>

    <!-- Botão -->
    <button class="btn btn-primary" id="btn-login" onclick="doLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
      </svg>
      Entrar
    </button>
  </div>
</div>

<!-- ══════════════════════════════════
     HOME
══════════════════════════════════ -->
<div id="page-home" class="page">

  <!-- Header -->
  <div class="app-header">
    <div class="header-left">
      <img src="/img/logo.png" alt="Haru" class="header-logo"
        onerror="this.style.display='none'"/>
      <span class="header-title">Eventos <span>Haru</span></span>
    </div>
    <div class="header-right">
      <span class="header-user" id="home-user-nome"></span>
      <div class="avatar" id="home-avatar" onclick="abrirMenuUsuario()">?</div>
    </div>
  </div>

  <!-- Conteúdo -->
  <div class="page-content">

    <!-- Evento ativo -->
    <div id="home-evento-badge" class="evento-badge" style="display:none">
      <div class="evento-badge-info">
        <div class="ev-label">Evento ativo</div>
        <div class="ev-nome" id="home-evento-nome">—</div>
        <div class="ev-data" id="home-evento-data">—</div>
      </div>
      <div class="ev-status-dot"></div>
    </div>

    <!-- Sem evento -->
    <div id="home-sem-evento" style="
      background:var(--surface);border:1.5px dashed var(--border);
      border-radius:var(--radius-lg);padding:16px;
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:14px;
    ">
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text-3)">Nenhum evento selecionado</div>
        <div style="font-size:11px;color:var(--text-4);margin-top:2px">Selecione um evento para começar</div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="goPage('page-eventos')" style="width:auto">
        Selecionar
      </button>
    </div>

    <!-- Resumo do evento -->
    <div id="home-resumo" style="display:none">
      <div class="stats-grid" style="margin-bottom:14px">
        <div class="stat-card">
          <div class="stat-val azul" id="stat-produtos">—</div>
          <div class="stat-lbl">Produtos</div>
        </div>
        <div class="stat-card">
          <div class="stat-val rosa" id="stat-vendidos">—</div>
          <div class="stat-lbl">Vendidos</div>
        </div>
        <div class="stat-card">
          <div class="stat-val verde" id="stat-faturamento" style="font-size:14px">—</div>
          <div class="stat-lbl">Faturado</div>
        </div>
      </div>
    </div>

    <!-- Botões principais -->
    <div class="home-grid">
      <button class="home-btn entrada" onclick="goApp('entrada')">
        <span class="hb-icon">📦</span>
        <span class="hb-title">Entrada</span>
        <span class="hb-desc">Cadastrar produtos</span>
      </button>
      <button class="home-btn retorno" onclick="goApp('retorno')">
        <span class="hb-icon">↩️</span>
        <span class="hb-title">Retorno</span>
        <span class="hb-desc">O que voltou</span>
      </button>
      <button class="home-btn relatorio" onclick="goApp('relatorio')">
        <span class="hb-icon">📊</span>
        <span class="hb-title">Relatório</span>
        <span class="hb-desc">Vendas do evento</span>
      </button>
      <button class="home-btn pesquisa" onclick="goApp('pesquisa')">
        <span class="hb-icon">🔍</span>
        <span class="hb-title">Pesquisa</span>
        <span class="hb-desc">Preço e estoque</span>
      </button>
    </div>

    <!-- Botão admin (só aparece para admin) -->
    <div id="home-btn-admin" style="display:none;margin-top:12px">
      <button class="btn btn-secondary" onclick="goPage('page-admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Painel Admin
      </button>
    </div>

    <div style="height:20px"></div>
  </div>
</div>

<!-- ══════════════════════════════════
     MODAL MENU USUÁRIO
══════════════════════════════════ -->
<div class="modal-bg" id="modal-usuario">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div class="avatar" style="width:44px;height:44px;font-size:18px" id="modal-usuario-avatar">?</div>
      <div>
        <div style="font-size:15px;font-weight:700" id="modal-usuario-nome">—</div>
        <div style="font-size:12px;color:var(--text-4)" id="modal-usuario-perfil">—</div>
      </div>
    </div>
    <div class="gap-8">
      <button class="btn btn-secondary" onclick="fecharModal('modal-usuario');goPage('page-eventos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        Trocar Evento
      </button>
      <button class="btn btn-danger" onclick="doLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Sair
      </button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
